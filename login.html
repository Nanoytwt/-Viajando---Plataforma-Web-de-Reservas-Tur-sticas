<!DOCTYPE html>
<html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Viajando</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
          :root{
              --primary:#0d6efd;
              --accent:#ff7a59;
              --muted:#6c757d;
          }
          body {
              background: linear-gradient(135deg, var(--primary), var(--accent));
              height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
          }
          .login-card {
              background-color: rgb(221, 221, 221);
              padding: 2rem;
              border-radius: 15px;
              box-shadow: 0 4px 20px rgba(17, 17, 17, 0.2);
              width: 100%;
              max-width: 400px;
          }
          .btn-custom {
              background-color: var(--primary);
              border: none;
              color: rgb(221, 221, 221);
          }
          .btn-custom:hover {
              background-color: #084298;
          }
          h2 {
              color: var(--accent);
          }
      </style>
  </head>
  <body>
      <div class="login-card">
          <h2 class="text-center mb-4">Viajando</h2>
          <form action="tarjetas.html" method="GET">
              <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="usuario@ejemplo.com" required>
              </div>
              <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" name="password" placeholder="********" required minlength="8">
              </div>
              <button type="submit" class="btn btn-custom w-100">Iniciar Sesión</button>
          </form>
      </div>
  </body>
</html>
