<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Reservar</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            :root{
                --primary:#0d6efd;
                --accent:#ff7a59;
                --muted:#6c757d;
            }
            body {
                background: var(--light-bg);
            }
            .navbar {
                background: var(--primary);
            }
            .navbar-brand, .nav-link {
                color: #ececec !important;
            }
            main.container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 80vh;
            }
            h3#reservar-hospedaje {
                color: var(--accent);
                font-weight: 600;
                margin-bottom: 1.5rem;
                text-align: center;
            }       
            form {
                background: #ececec;
                border-radius: 10px;
                box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.06);
                padding: 2rem 1.5rem 1.5rem 1.5rem;
                max-width: 350px;
                width: 100%;
            }
            .form-label {
                color: var(--primary);
                font-weight: 500;
            }
            .btn-primary {
                background: var(--accent);
                border: none;
                font-weight: 600;
                width: 100%;
            }
            .btn-primary:hover, .btn-primary:focus {
                background: #ff7a59;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="tarjetas.html">Viajando</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="tarjetas.html">Hospedajes</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="container my-5">
            <form id="reserva-form">
                <h3 id="reservar-hospedaje">Reservar hospedaje</h3>
                <div class="mb-3">
                    <label class="form-label">¿Qué hospedaje querés reservar?</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>Seleccioná una opción</option>
                        <option>Departamento en Calamuchita</option>
                        <option>Cabaña en las Sierras</option>
                        <option>Hostel céntrico</option>
                        <option>Casa en Villa Carlos Paz</option>
                        <option>Departamento Nueva Córdoba</option>
                        <option>Posada en La Cumbre</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" required minlength="3">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha de entrada</label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha de salida</label>
                    <input type="date" class="form-control" required>
                </div>
                <button class="btn btn-primary">Confirmar reserva</button>
            </form>
        </main>
    </body>
</html>
